<!doctype html>
<!-- GroSolar ad: style frames v2, in the official GroSolar colours (sampled from the logo: navy #002552, sun gradient #F6DA4C -> #FE9636, white).
     Five 1080x1920 stills, one per second. Snapshot: npx hyperframes snapshot . --at 0.5,1.5,2.5,3.5,4.5 -o shots -->
<html><head><meta charset="utf-8">
<script src="./gsap.min.js"></script>
<style>
@font-face{font-family:Poppins;src:url(./fonts/poppins-latin-500-normal.woff2) format('woff2');font-weight:500}
@font-face{font-family:Poppins;src:url(./fonts/poppins-latin-600-normal.woff2) format('woff2');font-weight:600}
@font-face{font-family:Poppins;src:url(./fonts/poppins-latin-700-normal.woff2) format('woff2');font-weight:700}
@font-face{font-family:Poppins;src:url(./fonts/poppins-latin-800-normal.woff2) format('woff2');font-weight:800}
:root{
  --navy:#002552;     /* GroSolar navy (logo background) */
  --navy-2:#0B3A73;   /* lifted navy for illustration planes */
  --sun-1:#F6DA4C;    /* logo gradient: light end */
  --sun-2:#FCBA34;    /* logo gradient: middle */
  --sun-3:#FE9636;    /* logo gradient: deep end */
  --sun:linear-gradient(135deg,#F6DA4C,#FCBA34 50%,#FE9636);
  --white:#FFFFFF;
  --paper:#F4F7FB;    /* daylight white */
  --mute-d:#B9C7DA;   /* small print on navy */
  --mute-l:#46586F;   /* small print on white */
}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--navy)}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Poppins,sans-serif;color:var(--navy)}
.f{position:absolute;inset:0;visibility:hidden}
.h{font-weight:800;letter-spacing:-0.03em;line-height:.95;margin:0}
.bug{position:absolute;left:80px;top:258px;width:76px;height:71px;border-radius:17px;overflow:hidden}
.bug img{width:100%;height:100%;display:block}
.small{font-size:44px;font-weight:500;letter-spacing:-.01em;margin:0}
.chip{position:absolute;display:flex;align-items:center;gap:16px;background:var(--white);border-radius:16px;padding:10px 22px;color:var(--navy)}
.chip .kw{font-weight:800;letter-spacing:-.02em;background:var(--sun);-webkit-background-clip:text;background-clip:text;color:transparent}
</style></head>
<body><div id="root" data-composition-id="frames" data-width="1080" data-height="1920" data-duration="5">

<!-- F1 HOOK: no light. Navy = darkness; the shop is drawn in lifted navies, signboard in sun colours -->
<section class="f" id="f1" style="background:var(--navy)">
  <svg width="1080" height="1920" style="position:absolute;inset:0">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6DA4C"/><stop offset=".5" stop-color="#FCBA34"/><stop offset="1" stop-color="#FE9636"/></linearGradient></defs>
    <line x1="850" y1="0" x2="850" y2="330" stroke="#B9C7DA" stroke-width="4"/>
    <rect x="834" y="330" width="32" height="34" rx="4" fill="#B9C7DA"/>
    <path d="M818 362 h64 v8 q22 30 22 62 a54 54 0 1 1 -108 0 q0 -32 22 -62z" fill="#0B3A73" stroke="#B9C7DA" stroke-width="5"/>
    <path d="M836 432 q14 -22 28 0" fill="none" stroke="#5F7699" stroke-width="4"/>
    <g transform="translate(0,190)">
      <ellipse cx="560" cy="1418" rx="420" ry="40" fill="#000" opacity=".25"/>
      <polygon points="740,920 900,830 900,1300 740,1390" fill="#08305F"/>
      <polygon points="200,920 360,830 900,830 740,920" fill="#123F78"/>
      <polygon points="200,895 360,805 900,805 740,895" fill="#1B4C8A"/>
      <rect x="200" y="895" width="540" height="25" fill="#1B4C8A"/>
      <rect x="200" y="920" width="540" height="470" fill="#0E3A70"/>
      <rect x="222" y="944" width="496" height="74" rx="6" fill="url(#sg)" opacity=".55"/>
      <text x="470" y="995" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="42" fill="#002552" letter-spacing="3">PROVISIONS</text>
      <rect x="252" y="1040" width="436" height="350" fill="#2A4E7E"/>
      <g stroke="#1C3F6C" stroke-width="3">
        <line x1="252" y1="1062" x2="688" y2="1062"/><line x1="252" y1="1084" x2="688" y2="1084"/><line x1="252" y1="1106" x2="688" y2="1106"/>
        <line x1="252" y1="1128" x2="688" y2="1128"/><line x1="252" y1="1150" x2="688" y2="1150"/><line x1="252" y1="1172" x2="688" y2="1172"/>
        <line x1="252" y1="1194" x2="688" y2="1194"/><line x1="252" y1="1216" x2="688" y2="1216"/><line x1="252" y1="1238" x2="688" y2="1238"/>
      </g>
      <rect x="252" y="1250" width="436" height="140" fill="#00183A"/>
      <rect x="430" y="1232" width="80" height="14" rx="7" fill="#5F7699"/>
    </g>
  </svg>
  <div style="position:absolute;left:80px;top:300px">
    <p class="h" style="font-size:176px;color:var(--white)">NO<br>LIGHT.</p>
    <p class="h" style="font-size:176px;margin-top:14px;background:var(--sun);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block">AGAIN?</p>
  </div>
</section>

<!-- F2 THE OFFER: daylight -->
<section class="f" id="f2" style="background:var(--paper)">
  <div style="position:absolute;left:-220px;top:-300px;width:640px;height:2600px;transform:rotate(28deg);background:linear-gradient(90deg,rgba(252,186,52,0),rgba(252,186,52,.45),rgba(254,150,54,0))"></div>
  <div class="bug"><img src="./brand/logo-icon.png"></div>
  <div style="position:absolute;left:80px;top:780px">
    <p class="h" style="font-size:186px">NOTHING</p>
    <p class="h" style="font-size:186px;margin-top:6px">UPFRONT.</p>
    <div style="width:880px;height:26px;border-radius:13px;background:var(--sun);margin-top:38px;box-shadow:0 0 40px rgba(252,186,52,.7)"></div>
    <p class="small" style="margin-top:46px;color:var(--mute-l)">Subject to approval. Terms apply.</p>
  </div>
</section>

<!-- F3 PAY IN INSTALMENTS -> OWNED -->
<section class="f" id="f3" style="background:var(--paper)">
  <img src="./img/vi-carport.jpg" style="position:absolute;left:0;top:1240px;width:1080px;height:680px;object-fit:cover">
  <div style="position:absolute;left:0;top:1240px;width:1080px;height:260px;background:linear-gradient(var(--paper),rgba(244,247,251,0))"></div>
  <div class="bug"><img src="./brand/logo-icon.png"></div>
  <p class="h" style="position:absolute;left:80px;top:410px;font-size:112px;line-height:1.05">Pay in<br>instalments.</p>
  <div style="position:absolute;left:80px;top:790px;width:860px">
    <div style="height:60px;border-radius:30px;background:rgba(0,37,82,.12);overflow:hidden"><div style="height:100%;width:100%;background:var(--sun)"></div></div>
    <div style="display:flex;justify-content:space-between;margin-top:16px;padding:0 6px">
      <i style="width:4px;height:22px;background:var(--navy);opacity:.45"></i><i style="width:4px;height:22px;background:var(--navy);opacity:.45"></i><i style="width:4px;height:22px;background:var(--navy);opacity:.45"></i><i style="width:4px;height:22px;background:var(--navy);opacity:.45"></i><i style="width:4px;height:22px;background:var(--navy);opacity:.45"></i><i style="width:4px;height:22px;background:var(--navy);opacity:.45"></i><i style="width:4px;height:22px;background:var(--navy);opacity:.45"></i><i style="width:4px;height:22px;background:var(--navy);opacity:.45"></i><i style="width:4px;height:22px;background:var(--navy);opacity:.45"></i>
    </div>
  </div>
  <div style="position:absolute;left:330px;top:935px;transform:rotate(-7deg);border-radius:24px;padding:10px 40px 20px;background:var(--navy);box-shadow:0 18px 40px rgba(0,37,82,.35),inset 0 0 0 8px rgba(252,186,52,.9)">
    <p class="h" style="font-size:160px;color:var(--white)">OWNED.</p>
  </div>
  <p class="small" style="position:absolute;left:80px;top:1188px;font-weight:600">Then it's yours.</p>
</section>

<!-- F4 REAL PROJECTS on navy -->
<section class="f" id="f4" style="background:var(--navy)">
  <div class="bug"><img src="./brand/logo-icon.png"></div>
  <p class="h" style="position:absolute;left:80px;top:370px;font-size:104px;color:var(--white)">Real GroSolar<br>projects.</p>
  <figure style="position:absolute;left:90px;top:620px;width:880px;height:540px;margin:0;transform:rotate(-2.5deg);border-radius:28px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.45)">
    <img src="./img/broadcaster-aerial.jpg" style="width:100%;height:100%;object-fit:cover;object-position:50% 40%">
    <figcaption class="chip" style="left:28px;bottom:28px"><span class="kw" style="font-size:62px">150 kW</span><span style="font-size:34px;font-weight:600;line-height:1.1">National<br>broadcaster</span></figcaption>
  </figure>
  <figure style="position:absolute;left:110px;top:1205px;width:820px;height:290px;margin:0;transform:rotate(2deg);border-radius:28px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.45)">
    <img src="./img/vi-carport-wide.jpg" style="width:100%;height:100%;object-fit:cover">
    <figcaption class="chip" style="left:24px;bottom:24px"><span class="kw" style="font-size:54px">100 kW</span><span style="font-size:34px;font-weight:600">Victoria Island</span></figcaption>
  </figure>
</section>

<!-- F5 CTA / END CARD on navy with the official logo -->
<section class="f" id="f5" style="background:var(--navy)">
  <div style="position:absolute;left:380px;top:1180px;width:1100px;height:1100px;border-radius:50%;background:radial-gradient(circle,rgba(252,186,52,.22),rgba(252,186,52,0) 62%)"></div>
  <img src="./brand/logo-lockup.png" style="position:absolute;left:80px;top:300px;width:860px">
  <div style="position:absolute;left:80px;top:640px;width:860px;color:var(--white)">
    <p class="h" style="font-size:92px">Check if you<br>qualify.</p>
    <div style="display:flex;align-items:center;gap:18px;margin-top:50px">
      <svg width="64" height="64" viewBox="0 0 64 64"><defs><linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6DA4C"/><stop offset="1" stop-color="#FE9636"/></linearGradient></defs><circle cx="32" cy="32" r="32" fill="url(#ig)"/><path d="M23 18c2-1 4 0 5 2l3 6c1 2 0 3-1 4l-2 2c2 4 5 7 9 9l2-2c1-1 3-2 4-1l6 3c2 1 3 3 2 5-1 4-5 6-9 5-12-3-20-11-23-23-1-4 1-8 4-10z" fill="#002552"/></svg>
      <svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="url(#ig)"/><path d="M32 15c-10 0-17 7-17 16 0 3 1 6 3 9l-2 9 9-3c2 1 5 2 7 2 10 0 17-7 17-17s-7-16-17-16z" fill="#002552"/></svg>
      <span style="font-size:44px;font-weight:600">Call or WhatsApp</span>
    </div>
    <p class="h" style="font-size:110px;margin-top:22px;letter-spacing:-.02em;white-space:nowrap;background:var(--sun);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block">0705 370 0000</p>
    <p style="font-size:44px;font-weight:600;margin:40px 0 0">Lagos and across Nigeria</p>
    <p style="font-size:44px;font-weight:500;margin:14px 0 0">GroSolar NG app · Google Play</p>
    <p class="small" style="margin-top:22px;color:var(--mute-d)">Subject to approval. Terms apply.</p>
  </div>
</section>

</div>
<script>
const ids=['f1','f2','f3','f4','f5'];
const show=t=>{const k=Math.min(4,Math.floor(t));ids.forEach((id,i)=>document.getElementById(id).style.visibility=i===k?'visible':'hidden');};
const st={t:0};
window.__timelines=window.__timelines||{};
window.__timelines.frames=gsap.timeline({paused:true}).to(st,{t:5,duration:5,ease:'none',onUpdate:()=>show(st.t)});
show(0);
</script>
</body></html>
